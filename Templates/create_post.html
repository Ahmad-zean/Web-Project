{% extends "layout.html" %}
{% block content %}
  <section class="content-section py-4 px-4 mb-4">
    <h1 class="h2 mb-3">Create a post</h1>
    <p class="text-body-secondary">
      Posting as <strong>{{ author }}</strong>.
    </p>

    {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('submit_create_post_page') }}"
          method="post"
          data-api-url="{{ request.url_for('create_post') }}"
          data-api-method="POST"
          data-redirect-template="{{ request.url_for('post_page', post_id=0) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input id="title"
               name="title"
               type="text"
               class="form-control"
               maxlength="100"
               value="{{ post_title }}"
               required>
      </div>
      <div class="mb-3">
        <label for="content" class="form-label">Content</label>
        <textarea id="content"
                  name="content"
                  class="form-control"
                  rows="8"
                  maxlength="1000"
                  required>{{ content }}</textarea>
      </div>
      <div class="mb-3">
        <label for="summary" class="form-label">Summary (optional)</label>
        <textarea id="summary"
                  name="summary"
                  class="form-control"
                  rows="2"
                  maxlength="240">{{ summary }}</textarea>
      </div>
      <div class="mb-3">
        <label for="category" class="form-label">Category (optional)</label>
        <input id="category"
               name="category"
               type="text"
               class="form-control"
               maxlength="50"
               list="category-options"
               value="{{ category }}">
        <datalist id="category-options">
          {% for item in categories %}<option value="{{ item.name }}">{% endfor %}
        </datalist>
      </div>
      <div class="mb-3">
        <label for="tags" class="form-label">Tags (comma-separated, up to 10)</label>
        <input id="tags"
               name="tags"
               type="text"
               class="form-control"
               maxlength="450"
               value="{{ tags }}"
               aria-describedby="tags-help">
        <div id="tags-help" class="form-text">For example: FastAPI, Python, Web</div>
      </div>
      <button type="submit" class="btn btn-primary">Publish post</button>
    </form>
  </section>
{% endblock content %}
