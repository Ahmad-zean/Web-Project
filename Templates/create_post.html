{% extends "layout.html" %}
{% block content %}
  <section class="content-section py-4 px-4 mb-4">
    <h1 class="h2 mb-3">Create a post</h1>
    <p class="text-body-secondary">
      Posting as <strong>{{ author }}</strong>.
    </p>

    {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('submit_create_post_page') }}"
          method="post"
          data-api-url="{{ request.url_for('create_post') }}"
          data-api-method="POST"
          data-redirect-template="{{ request.url_for('post_page', post_id=0) }}">
      <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input id="title"
               name="title"
               type="text"
               class="form-control"
               maxlength="100"
               value="{{ post_title }}"
               required>
      </div>
      <div class="mb-3">
        <label for="content" class="form-label">Content</label>
        <textarea id="content"
                  name="content"
                  class="form-control"
                  rows="8"
                  maxlength="1000"
                  required>{{ content }}</textarea>
      </div>
      <button type="submit" class="btn btn-primary">Publish post</button>
    </form>
  </section>
{% endblock content %}
