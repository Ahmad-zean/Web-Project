{% extends "layout.html" %}
{% block content %}
  <section class="content-section py-4 px-4 mb-4">
    <h1 class="h2 mb-3">Choose a new password</h1>
    {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}
    {% if valid %}
      <form action="{{ url_for('submit_reset_password_page', token=token) }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-3">
          <label for="new_password" class="form-label">New password</label>
          <input id="new_password"
                 name="new_password"
                 type="password"
                 class="form-control"
                 minlength="8"
                 maxlength="128"
                 autocomplete="new-password"
                 required>
        </div>
        <div class="mb-3">
          <label for="confirm_password" class="form-label">Confirm new password</label>
          <input id="confirm_password"
                 name="confirm_password"
                 type="password"
                 class="form-control"
                 minlength="8"
                 maxlength="128"
                 autocomplete="new-password"
                 required>
        </div>
        <button type="submit" class="btn btn-primary">Update password</button>
      </form>
    {% else %}
      <div class="alert alert-warning" role="status">
        This reset link is invalid, expired, or already used.
      </div>
      <a href="{{ url_for('forgot_password_page') }}">Request a new reset link</a>
    {% endif %}
  </section>
{% endblock content %}
