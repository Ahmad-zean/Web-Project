{% extends "layout.html" %}
{% block content %}
  <section class="content-section py-4 px-4 mb-4">
    <h1 class="h2 mb-3">Delete post</h1>
    <p>
      Are you sure you want to delete <strong>{{ post.title }}</strong>?
      Only you can delete your post. This cannot be undone.
    </p>

    {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('submit_delete_post_page', post_id=post.id) }}"
          method="post"
          data-api-url="{{ request.url_for('delete_post', post_id=post.id) }}"
          data-api-method="DELETE"
          data-redirect-url="{{ request.url_for('home') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="btn btn-danger">Delete post</button>
      <a class="btn btn-outline-secondary"
         href="{{ url_for('post_page', post_id=post.id) }}">Cancel</a>
    </form>
  </section>
{% endblock content %}
