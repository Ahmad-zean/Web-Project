{% extends "layout.html" %}
{% block content %}
  <section class="content-section py-4 px-4 mb-4">
    <h1 class="h2 mb-3">Register</h1>
    <p class="text-body-secondary">Create an account to join the community.</p>

    {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('submit_register_page') }}" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username"
               name="username"
               type="text"
               class="form-control"
               maxlength="50"
               autocomplete="username"
               value="{{ username }}"
               required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email"
               name="email"
               type="email"
               class="form-control"
               maxlength="120"
               autocomplete="email"
               value="{{ email }}"
               required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password"
               name="password"
               type="password"
               class="form-control"
               minlength="8"
               maxlength="128"
               autocomplete="new-password"
               aria-describedby="password-help"
               required>
        <div id="password-help" class="form-text">Use at least 8 characters.</div>
      </div>
      <div class="mb-3">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input id="confirm_password"
               name="confirm_password"
               type="password"
               class="form-control"
               minlength="8"
               maxlength="128"
               autocomplete="new-password"
               required>
      </div>
      <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <p class="mt-3 mb-0">Already have an account? <a href="{{ url_for('login_page') }}">Login</a></p>
  </section>
{% endblock content %}
