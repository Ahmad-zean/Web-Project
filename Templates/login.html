{% extends "layout.html" %}
{% block content %}
  <section class="content-section py-4 px-4 mb-4">
    <h1 class="h2 mb-3">Login</h1>
    <p class="text-body-secondary">Sign in to your account.</p>

    {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('submit_login_page') }}" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3">
        <label for="identifier" class="form-label">Username or Email</label>
        <input id="identifier"
               name="identifier"
               type="text"
               class="form-control"
               maxlength="120"
               autocomplete="username"
               value="{{ identifier }}"
               required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password"
               name="password"
               type="password"
               class="form-control"
               maxlength="128"
               autocomplete="current-password"
               required>
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p class="mt-2 mb-0"><a href="{{ url_for('forgot_password_page') }}">Forgot your password?</a></p>
    <p class="mt-3 mb-0">Need an account? <a href="{{ url_for('register_page') }}">Register</a></p>
  </section>
{% endblock content %}
