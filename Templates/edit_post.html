{% extends "layout.html" %}
{% block content %}
  <section class="content-section py-4 px-4 mb-4">
    <h1 class="h2 mb-3">Edit post</h1>
    <p class="text-body-secondary">
      Leave a field unchanged to keep its current value. Only you can edit your post.
    </p>

    {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    <form action="{{ url_for('submit_edit_post_page', post_id=post.id) }}"
          method="post"
          data-api-url="{{ request.url_for('update_full_post', post_id=post.id) }}"
          data-api-method="PUT"
          data-redirect-url="{{ request.url_for('post_page', post_id=post.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input id="title"
               name="title"
               type="text"
               class="form-control"
               maxlength="100"
               value="{{ post_title }}"
               required>
      </div>
      <div class="mb-3">
        <label for="content" class="form-label">Content</label>
        <textarea id="content"
                  name="content"
                  class="form-control"
                  rows="8"
                  maxlength="1000"
                  required>{{ content }}</textarea>
      </div>
      <div class="mb-3">
        <label for="summary" class="form-label">Summary (optional)</label>
        <textarea id="summary"
                  name="summary"
                  class="form-control"
                  rows="2"
                  maxlength="240">{{ summary }}</textarea>
      </div>
      <div class="mb-3">
        <label for="category" class="form-label">Category (optional)</label>
        <input id="category"
               name="category"
               type="text"
               class="form-control"
               maxlength="50"
               value="{{ category }}">
      </div>
      <div class="mb-3">
        <label for="tags" class="form-label">Tags (comma-separated, up to 10)</label>
        <input id="tags"
               name="tags"
               type="text"
               class="form-control"
               maxlength="450"
               value="{{ tags }}">
      </div>
      <button type="submit" class="btn btn-primary">Save changes</button>
      <a class="btn btn-outline-secondary"
         href="{{ url_for('post_page', post_id=post.id) }}">Cancel</a>
    </form>
  </section>
{% endblock content %}
